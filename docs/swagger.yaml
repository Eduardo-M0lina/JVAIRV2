      - application/json
      description: Retorna el dashboard con jobs según el rol del usuario. Admin ve
        jobs awaiting dispatch y urgent jobs. Técnicos ven jobs dispatched a ellos
        y sus urgent jobs. Soporta filtros, ordenamiento, búsqueda y paginación.
      parameters:
      - description: 'Número de página (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamaño de página (default: 20)'
        in: query
        name: pageSize
        type: integer
      - description: Alias de pageSize para backward compatibility
        in: query
        name: limit
        type: integer
      - description: Filtrar por técnico (ID numérico o 'unassigned')
        in: query
        name: filters[user_id]
        type: string
      - description: Filtrar por estado del job
        in: query
        name: filters[job_status_id]
        type: integer
      - description: Filtrar por prioridad del job
        in: query
        name: filters[job_priority_id]
        type: integer
      - description: Filtrar por estado abierto/cerrado ('0', '1', 'all')
        in: query
        name: filters[is_closed]
        type: string
      - description: Filtrar por año
        in: query
        name: filters[year]
        type: integer
      - description: Filtrar por número de semana
        in: query
        name: filters[week]
        type: integer
      - description: 'Filtrar jobs creados en los últimos X días (ej: 7, 30, 90)'
        in: query
        name: filters[last_days]
        type: integer
      - description: Búsqueda de texto libre en work_order, property, customer, etc.
        in: query
        name: search
        type: string
      - description: Campo para ordenar (work_order, date_received, dispatch_date,
          due_date, completion_date, week_number, job_sales_price, property.city,
          property.zip, property.customer.name, user_id, status, priority.order)
        in: query
        name: sort
        type: string
      - description: 'Dirección del ordenamiento (''asc'' o ''desc'', default: ''desc'')'
        in: query
        name: direction
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard de técnico
          schema:
            $ref: '#/definitions/dashboard.TechnicianDashboard'
        "401":
          description: Usuario no autenticado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error interno del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      security:
