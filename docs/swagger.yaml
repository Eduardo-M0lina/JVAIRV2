host: localhost:8090
info:
  contact:
    email: support@jvair.com
    name: API Support
    url: http://www.jvair.com/support
  description: API para el sistema JVAIR
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: JVAIR API
  version: "1.0"
paths:
  /api/v1/abilities:
    get:
      consumes:
      - application/json
      description: Obtiene una lista paginada de abilities
      parameters:
      - description: 'Número de página (por defecto: 1)'
        in: query
        name: page
        type: integer
      - description: 'Tamaño de página (por defecto: 10)'
        in: query
        name: pageSize
        type: integer
      - description: Filtrar por nombre
        in: query
        name: name
        type: string
      - description: Filtrar por tipo de entidad
        in: query
        name: entityType
        type: string
      - description: Filtrar por scope
        in: query
        name: scope
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedResponse'
        "400":
          description: Parámetros de consulta inválidos
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Listar abilities
      tags:
      - Abilities
    post:
      consumes:
      - application/json
      description: Crea una nueva ability en el sistema
      parameters:
      - description: Datos de la ability
        in: body
        name: ability
        required: true
        schema:
          $ref: '#/definitions/ability.CreateAbilityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ability.AbilityResponse'
        "400":
          description: Error al decodificar la solicitud o datos inválidos
          schema:
            type: string
        "409":
          description: Nombre de ability ya está en uso
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Crear ability
      tags:
      - Abilities
  /api/v1/abilities/{id}:
    delete:
      consumes:
      - application/json
      description: Elimina una ability
      parameters:
      - description: ID de la ability
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: ID de ability inválido
          schema:
            type: string
        "404":
          description: Ability no encontrada
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Eliminar ability
      tags:
      - Abilities
    get:
      consumes:
      - application/json
      description: Obtiene una ability por su ID
      parameters:
      - description: ID de la ability
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ability.AbilityResponse'
        "400":
          description: ID de ability inválido
          schema:
            type: string
        "404":
          description: Ability no encontrada
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Obtener ability
      tags:
      - Abilities
    put:
      consumes:
      - application/json
      description: Actualiza una ability existente
      parameters:
      - description: ID de la ability
        in: path
        name: id
        required: true
        type: integer
      - description: Datos de la ability
        in: body
        name: ability
        required: true
        schema:
          $ref: '#/definitions/ability.UpdateAbilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ability.AbilityResponse'
        "400":
          description: Error al decodificar la solicitud o datos inválidos
          schema:
            type: string
        "404":
          description: Ability no encontrada
          schema:
            type: string
        "409":
          description: Nombre de ability ya está en uso
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Actualizar ability
      tags:
      - Abilities
  /api/v1/alerts:
    get:
      consumes:
      - application/json
      description: Get all alerts with optional filters and pagination
      parameters:
      - description: Filter by user ID
        in: query
        name: userId
        type: integer
      - description: Filter by read status (true/false)
        in: query
        name: isRead
        type: boolean
      - description: Filter by alert type
        in: query
        name: alertType
        type: string
      - description: Filter by entity type
        in: query
        name: entityType
        type: string
      - default: 15
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/alert.ListResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List alerts
      tags:
      - Alerts
    post:
      consumes:
      - application/json
      description: Create a new alert (typically used by system events)
      parameters:
      - description: Alert data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/alert.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/alert.Alert'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
